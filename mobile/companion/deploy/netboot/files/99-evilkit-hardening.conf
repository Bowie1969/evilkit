# sysctl hardening for the evilkit drop device -> /etc/sysctl.d/99-evilkit-hardening.conf
# The drop is an endpoint, not a router: do not forward packets between its
# interfaces. (If you later need the companion to pivot/route, this is the knob
# to revisit -- deliberately off by default.)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Ignore ICMP redirects and source-routed packets.
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Reverse-path filtering.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
